<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
            line-height: 1.4;
        }
        
        .form-container {
            max-width: 500px;
            margin: 20px auto;
            background: white;
            border: 2px solid #999;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .form-title {
            background: #f0f0f0;
            margin: -20px -20px 20px -20px;
            padding: 15px 20px;
            border-bottom: 1px solid #ccc;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        .form-group textarea {
            height: 120px;
            resize: vertical;
        }
        
        .file-input-container {
            position: relative;
            display: inline-block;
        }
        
        .file-input {
            position: relative;
            overflow: hidden;
            display: inline-block;
            cursor: pointer;
        }
        
        .file-input input[type="file"] {
            position: absolute;
            left: -9999px;
        }
        
        .file-input-button {
            padding: 6px 12px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 10px;
        }
        
        .file-input-button:hover {
            background: #e0e0e0;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        
        .checkbox-container input[type="checkbox"] {
            margin-right: 8px;
        }
        
        .submit-button {
            background: #f0f0f0;
            border: 1px solid #999;
            padding: 8px 20px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .submit-button:hover {
            background: #e0e0e0;
        }
        
        .inline-form {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .inline-form label {
            margin-bottom: 0;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-title">Contact Us</div>
        
        <form id="contactForm">
            <div class="form-group">
                <label>Your message:</label>
                <div class="inline-form">
                    <label for="contactTo">To:</label>
                    <input type="text" id="contactTo" name="to" value="Example Cafe" style="width: 200px;">
                </div>
                <div class="inline-form" style="margin-top: 10px;">
                    <label for="contactEmail">Your email:</label>
                    <input type="email" id="contactEmail" name="email" style="width: 200px;">
                </div>
            </div>
            
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Enter your message here..."></textarea>
            </div>
            
            <div class="form-group">
                <label>Attach File:</label>
                <div class="file-input">
                    <input type="file" id="fileAttachment" name="attachment">
                    <label for="fileAttachment" class="file-input-button">Choose File</label>
                    <span id="fileName">No file chosen</span>
                </div>
            </div>
            
            <div class="form-group">
                <div class="inline-form">
                    <label for="howFound">How you found us:</label>
                    <select id="howFound" name="howFound" style="width: 200px;">
                        <option value="google">Google</option>
                        <option value="facebook">Facebook</option>
                        <option value="twitter">Twitter</option>
                        <option value="friend">Friend Referral</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <div class="checkbox-container">
                    <input type="checkbox" id="newsletter" name="newsletter" checked>
                    <label for="newsletter">Ensure this box is checked if you would like to receive email updates</label>
                </div>
            </div>
            
            <button type="submit" class="submit-button">Send message</button>
        </form>
    </div>
    
    <script>
        // File input functionality
        document.getElementById('fileAttachment').addEventListener('change', function(e) {
            const fileName = e.target.files[0] ? e.target.files[0].name : 'No file chosen';
            document.getElementById('fileName').textContent = fileName;
        });
        
        // Form submission
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form data
            const formData = {
                to: document.getElementById('contactTo').value,
                email: document.getElementById('contactEmail').value,
                message: document.getElementById('message').value,
                howFound: document.getElementById('howFound').value,
                newsletter: document.getElementById('newsletter').checked,
                attachment: document.getElementById('fileAttachment').files[0]?.name || 'None'
            };
            
            // Display form data (for demo purposes)
            let summary = 'Message sent successfully!\n\nForm Data:\n';
            summary += `To: ${formData.to}\n`;
            summary += `From: ${formData.email}\n`;
            summary += `Message: ${formData.message}\n`;
            summary += `How found us: ${formData.howFound}\n`;
            summary += `Newsletter: ${formData.newsletter ? 'Yes' : 'No'}\n`;
            summary += `Attachment: ${formData.attachment}`;
            
            alert(summary);
        });
    </script>
</body>
</html>
